#           protocol: "claude" # restricts the rule to a specific protocol, options: openai, claude
#           from-protocol: "responses" # restricts the rule to the source protocol, options: openai, responses, claude
#           headers: # all configured request headers must match; values support "*" wildcards
#             X-Client-Tier: "tenant-*-region-*"
